<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Hybrid 3.0 The Game</title>
    <meta name="author" content="Idleside Studio" />
    <style type="text/css"> body { background-color:#202850; }</style>

  </head>
  <body>
    <div id="game">
      <canvas id="mainCanvas" width="256" height="224">No Canvas Support</canvas>
    </div>
    <div id="controls">
      <button id="cp-toggle" class="cp-toggle" aria-expanded="true">
        <span>Controls</span><span class="cp-chevron" aria-hidden="true"></span>
      </button>
      <div class="cp-body">
        <div class="cp-row"><span class="cp-lbl">Move</span><span class="cp-keys"><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd></span></div>
        <div class="cp-row"><span class="cp-lbl">A</span><span class="cp-keys"><kbd>Z</kbd></span></div>
        <div class="cp-row"><span class="cp-lbl">B</span><span class="cp-keys"><kbd>X</kbd></span></div>
        <div class="cp-row"><span class="cp-lbl">Start</span><span class="cp-keys"><kbd>Enter</kbd></span></div>
        <div class="cp-row"><span class="cp-lbl">Select</span><span class="cp-keys"><kbd>Shift</kbd></span></div>
        <div class="cp-divider"></div>
        <div class="cp-row cp-sub"><span class="cp-lbl">Pause</span><span class="cp-keys"><kbd>Space</kbd></span></div>
        <div class="cp-row cp-sub"><span class="cp-lbl">Rewind</span><span class="cp-keys"><kbd>Bksp</kbd></span></div>
      </div>
    </div>
    <div id="controller">
      <div id="controller_dpad">
        <div id="controller_left"></div>
        <div id="controller_right"></div>
        <div id="controller_up"></div>
        <div id="controller_down"></div>
      </div>
      <div id="controller_select" class="capsuleBtn">Select</div>
      <div id="controller_start" class="capsuleBtn">Start</div>
      <div id="controller_b" class="roundBtn">B</div>
      <div id="controller_a" class="roundBtn">A</div>
    </div>      
    <script>
      const customControls = {"up":["ArrowUp","w"],"down":["ArrowDown","s"],"left":["ArrowLeft","a"],"right":["ArrowRight","d"],"a":["Alt","z","j"],"b":["Control","k","x"],"start":["Enter"],"select":["Shift"]}
    </script>
    <script src="binjgb.js"></script>
    <script src="js/script.js"></script>
    <script src="js/debugger.js"></script>
    <script>
      // Minimize/expand the quiet desktop controls panel (remembers your choice).
      (function () {
        var panel = document.getElementById("controls");
        var toggle = document.getElementById("cp-toggle");
        if (!panel || !toggle) return;
        var KEY = "hybrid_controls_min";
        try {
          if (localStorage.getItem(KEY) === "1") {
            panel.classList.add("minimized");
            toggle.setAttribute("aria-expanded", "false");
          }
        } catch (e) {}
        toggle.addEventListener("click", function () {
          var min = panel.classList.toggle("minimized");
          toggle.setAttribute("aria-expanded", min ? "false" : "true");
          try { localStorage.setItem(KEY, min ? "1" : "0"); } catch (e) {}
        });
      })();
    </script>
</body>
