  <style>
    @font-face {
      font-family: 'PressStart2P';

    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'PressStart2P', monospace;
      min-height: 100vh;
      display: flex;

    }

    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      animation: twinkle var(--duration) var(--delay) infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.8; }
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      max-width: 420px;
      width: 90vw;
      height: auto;
      image-rendering: auto;
    }

    .tagline {
      font-size: 0.55rem;
      line-height: 1.8;
      color: #aaa;
      max-width: 500px;
      letter-spacing: 0.5px;
    }

    .divider {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .divider span {
      display: block;
      width: 6px;
      height: 6px;
    }

    /* Screen bezel */
    .gbc-bezel {
      background: #1a1a2e;
      border-radius: 6px;
      padding: 10px;
      max-width: 440px;
      width: 88vw;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
    }

    /* GBC LCD screen */
    .gbc-screen {
      background: #1d3b1e;
      aspect-ratio: 166 / 140;
      width: 100%;
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.2rem 1rem;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    }

    /* Pixel grid overlay */
    .gbc-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.12) 2px,
          rgba(0,0,0,0.12) 3px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.12) 2px,
          rgba(0,0,0,0.12) 3px
        );
      pointer-events: none;
      z-index: 1;
    }

    /* Slight scanline glow */
    .gbc-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(155, 188, 15, 0.04) 0%,
        transparent 50%,
        rgba(155, 188, 15, 0.02) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .event-label {
      font-size: 0.75rem;
      color: #9bbc0f;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .event-title {
      font-size: 0.8rem;
      line-height: 2;
      color: #9bbc0f;
    }

    .event-title strong {
      color: #cadc9f;
    }

    .event-date {
      font-size: 0.9rem;
      color: #8bac0f;
      letter-spacing: 1px;
    }

    .event-venue {
      font-size: 0.65rem;
      color: #6b8c0f;
    }

    .ticket-link {
      display: inline-block;
      margin-top: 0.3rem;
      font-family: 'PressStart2P', monospace;
      font-size: 0.8rem;
      color: #1d3b1e;
      background: #9bbc0f;
      padding: 0.8rem 1.4rem;
      text-decoration: none;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      z-index: 3;
      transition: background 0.2s;
    }

    .ticket-link:hover {
      background: #cadc9f;
    }

    .screen-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 0.3rem;
      position: relative;
      z-index: 3;
    }

    .screen-logo {
      height: 81px;
      width: auto;
      filter: brightness(0) saturate(100%) invert(68%) sepia(65%) saturate(430%) hue-rotate(25deg) brightness(92%);
      opacity: 0.6;
    }

    .ticket-link-pulse {
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .social {

    .social a:hover {

    .location {

      .ticket-link { font-size: 0.55rem; padding: 0.6rem 1rem; }
