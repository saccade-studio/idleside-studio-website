<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Poppy — Idleside Studio</title>
  <meta name="description" content="Meet Poppy, one of six collectible Idleside Studio ducks. Tap to hatch, then post to your Instagram story and tag @dvbbydoo to collect all 6.">
  <link rel="canonical" href="https://idleside.studio/duck/poppy">
  <link rel="icon" type="image/png" href="../../goosecon.png">
  <meta name="theme-color" content="#160202">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://idleside.studio/duck/poppy">
  <meta property="og:title" content="Poppy — Idleside Studio">
  <meta property="og:description" content="Tap to hatch Poppy! Collect all 6 ducks and tag @dvbbydoo.">
  <meta property="og:image" content="https://idleside.studio/duck/assets/poppy.gif">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" as="image" href="../assets/poppy.gif">
  <link rel="stylesheet" href="../duck.css">
</head>
<body>
  <main class="stage duckbg" style="background-image:url('../assets/bg/Poppy.jpg')">
    <div class="frame-wrap" id="frame" role="button" tabindex="0" aria-label="Tap to hatch the egg">
      <div class="window"><img class="anim" id="anim" alt="" decoding="async"></div>
      <img class="frame" src="../assets/frame.png" alt="" decoding="async">
    </div>

    <div class="prompt" id="prompt">&#9654; TAP TO HATCH</div>

    <section class="gb" id="gb" aria-label="Poppy info screen">
      <div class="gb-screen">
        <div class="gb-name" id="gbname"></div>
        <div class="gb-text" id="gbtext"></div>
      </div>
    </section>
  </main>

  <script>window.DUCK = {"name": "POPPY", "gif": "poppy.gif", "accent": "#ff7aa8", "dense": false, "bio": "Hi, I'm Poppy! I'm here to make friends, give hugs, and be adorable. Wanna be best friends?\n\nPost me to your Instagram story and tag @dvbbydoo! Collect all 6 for a prize!"};</script>
  <script src="../duck.js"></script>
</body>
</html>
