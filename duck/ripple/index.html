<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ripple — Idleside Studio</title>
  <meta name="description" content="Meet Ripple, one of six collectible Idleside Studio ducks. Tap to hatch, then post to your Instagram story and tag @dvbby_doo to collect all 6.">
  <link rel="canonical" href="https://idleside.studio/duck/ripple">
  <link rel="icon" type="image/png" href="../../goosecon.png">
  <meta name="theme-color" content="#160202">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://idleside.studio/duck/ripple">
  <meta property="og:title" content="Ripple — Idleside Studio">
  <meta property="og:description" content="Tap to hatch Ripple! Collect all 6 ducks and tag @dvbby_doo.">
  <meta property="og:image" content="https://idleside.studio/duck/assets/ripple.gif">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" as="image" href="../assets/ripple.gif">
  <link rel="stylesheet" href="../duck.css">
</head>
<body>
  <main class="stage">
    <div class="frame-wrap" id="frame" role="button" tabindex="0" aria-label="Tap to hatch the egg">
      <div class="window"><img class="anim" id="anim" alt="" decoding="async"></div>
      <img class="frame" src="../assets/frame.png" alt="" decoding="async">
    </div>

    <div class="prompt" id="prompt">&#9654; TAP TO HATCH</div>

    <section class="gb" id="gb" aria-label="Ripple info screen">
      <div class="gb-screen">
        <div class="gb-name" id="gbname"></div>
        <div class="gb-text" id="gbtext"></div>
      </div>
    </section>
  </main>

  <script>window.DUCK = {"name": "RIPPLE", "gif": "ripple.gif", "accent": "#5bc8ff", "dense": false, "bio": "Hi, I'm Ripple. I'm following the current today. My only plans are to watch the sunset. Wanna join?\n\nPost me to your Instagram story and tag @dvbby_doo\nCollect all 6 for a prize."};</script>
  <script src="../duck.js"></script>
</body>
</html>
