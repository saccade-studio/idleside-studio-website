<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Hybrid 3.0 The Game</title>
    <meta name="author" content="Idleside Studio" />
    <style type="text/css"> body { background-color:#202850; }</style>

  </head>
  <body>
    <div id="game">
      <canvas id="mainCanvas" width="256" height="224">No Canvas Support</canvas>
    </div>
    <div id="intro">
      <div class="intro-card">
        <div class="intro-bar">Idleside &middot; Hybrid 3.0</div>
        <div class="intro-head">CONTROLS</div>
        <div class="intro-grid">
          <span class="lbl">Move</span><span class="keys"><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd><span class="sep">/</span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
          <span class="lbl">A</span><span class="keys"><kbd>Z</kbd></span>
          <span class="lbl">B</span><span class="keys"><kbd>X</kbd></span>
          <span class="lbl">Start</span><span class="keys"><kbd>Enter</kbd></span>
          <span class="lbl">Select</span><span class="keys"><kbd>Shift</kbd></span>
        </div>
        <div class="intro-extra"><kbd>Space</kbd> Pause &middot; <kbd>Backspace</kbd> Rewind</div>
        <div class="intro-prompt">Press any key to play</div>
      </div>
    </div>
    <div id="controller">
      <div id="controller_dpad">
        <div id="controller_left"></div>
        <div id="controller_right"></div>
        <div id="controller_up"></div>
        <div id="controller_down"></div>
      </div>
      <div id="controller_select" class="capsuleBtn">Select</div>
      <div id="controller_start" class="capsuleBtn">Start</div>
      <div id="controller_b" class="roundBtn">B</div>
      <div id="controller_a" class="roundBtn">A</div>
    </div>      
    <script>
      const customControls = {"up":["ArrowUp","w"],"down":["ArrowDown","s"],"left":["ArrowLeft","a"],"right":["ArrowRight","d"],"a":["Alt","z","j"],"b":["Control","k","x"],"start":["Enter"],"select":["Shift"]}
    </script>
    <script src="binjgb.js"></script>
    <script src="js/script.js"></script>
    <script src="js/debugger.js"></script>
    <script>
      // Dismiss the desktop controls overlay once the player starts (key or click).
      (function () {
        var done = false;
        function dismiss() {
          if (done) return;
          done = true;
          var el = document.getElementById("intro");
          if (!el) return;
          el.classList.add("dismissed");
          setTimeout(function () { el.classList.add("hidden"); }, 500);
        }
        window.addEventListener("keydown", dismiss);
        window.addEventListener("pointerdown", dismiss);
      })();
    </script>
</body>
