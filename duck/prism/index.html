<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prism — Idleside Studio</title>
  <meta name="description" content="Meet Prism, one of six collectible Idleside Studio ducks. Tap to hatch, then post to your Instagram story and tag @dvbbydoo to collect all 6.">
  <link rel="canonical" href="https://idleside.studio/duck/prism">
  <link rel="icon" type="image/png" href="../../goosecon.png">
  <meta name="theme-color" content="#160202">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://idleside.studio/duck/prism">
  <meta property="og:title" content="Prism — Idleside Studio">
  <meta property="og:description" content="Tap to hatch Prism! Collect all 6 ducks and tag @dvbbydoo.">
  <meta property="og:image" content="https://idleside.studio/duck/assets/prism.gif">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" as="image" href="../assets/prism.gif">
  <link rel="preload" as="image" href="../assets/EGG_HATCH.gif">
  <link rel="stylesheet" href="../duck.css">
</head>
<body>
  <main class="stage duckbg" style="background-image:url('../assets/bg/Prism.jpg')">
    <div class="frame-wrap" id="frame" role="button" tabindex="0" aria-label="Tap to hatch the egg">
      <div class="window"><img class="anim" id="anim" alt="" decoding="async"></div>
      <img class="frame" src="../assets/frame.png" alt="" decoding="async">
    </div>

    <div class="prompt" id="prompt">&#9654; TAP TO HATCH</div>

    <section class="gb" id="gb" aria-label="Prism info screen">
      <div class="gb-screen">
        <div class="gb-name" id="gbname"></div>
        <div class="gb-text" id="gbtext"></div>
      </div>
    </section>
  </main>

  <script>window.DUCK = {"name": "PRISM", "gif": "prism.gif", "accent": "#ff8a5b", "dense": false, "bio": "*HONK* That wasn't me, it was my nose! Hehe ^_^ I'm the silliest of all. Can you guess what I'm dressed as?\n\nI'm a clown! *HONK**HONK* but you can call me Prism.\n\nPost me to your Instagram story and tag @DVBBYDOO\nCollect all 6 to win a prize!"};</script>
  <script src="../duck.js"></script>
</body>
</html>
