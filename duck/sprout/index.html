<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sprout — Idleside Studio</title>
  <meta name="description" content="Meet Sprout, one of six collectible Idleside Studio ducks. Tap to hatch, then post to your Instagram story and tag @dvbbydoo to collect all 6.">
  <link rel="canonical" href="https://idleside.studio/duck/sprout">
  <link rel="icon" type="image/png" href="../../goosecon.png">
  <meta name="theme-color" content="#160202">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://idleside.studio/duck/sprout">
  <meta property="og:title" content="Sprout — Idleside Studio">
  <meta property="og:description" content="Tap to hatch Sprout! Collect all 6 ducks and tag @dvbbydoo.">
  <meta property="og:image" content="https://idleside.studio/duck/assets/sprout.gif">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" as="image" href="../assets/sprout.gif">
  <link rel="stylesheet" href="../duck.css">
</head>
<body>
  <main class="stage">
    <div class="frame-wrap" id="frame" role="button" tabindex="0" aria-label="Tap to hatch the egg">
      <div class="window"><img class="anim" id="anim" alt="" decoding="async"></div>
      <img class="frame" src="../assets/frame.png" alt="" decoding="async">
    </div>

    <div class="prompt" id="prompt">&#9654; TAP TO HATCH</div>

    <section class="gb" id="gb" aria-label="Sprout info screen">
      <div class="gb-screen">
        <div class="gb-name" id="gbname"></div>
        <div class="gb-text" id="gbtext"></div>
      </div>
    </section>
  </main>

  <script>window.DUCK = {"name": "SPROUT", "gif": "sprout.gif", "accent": "#7ed957", "dense": false, "bio": "Hi, I'm Sprout! I found this sparkly rock in the forest. It made me think of you, so here you go!\n\nPost me to your Instagram story and tag @dvbbydoo\nCollect all 6 for a prize!"};</script>
  <script src="../duck.js"></script>
</body>
</html>
