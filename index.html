<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta property="og:image" content="https://idleside.studio/assets/idleside-color-logo.png">
  <meta property="og:image:alt" content="Idleside Studio logo">

  <!-- Twitter Card -->

  <meta name="twitter:description" content="An independent retro-style games studio crafting 8-bit adventures. Based in Chattanooga, Tennessee.">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Idleside Studio",
    "url": "https://idleside.studio",

    "address": {
      "@type": "PostalAddress",

      "addressCountry": "US"
    },
    "sameAs": ["https://www.instagram.com/idleside.studio/"],
    "knowsAbout": ["indie games", "retro games", "8-bit games", "pixel art", "Game Boy Color"],

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --green: #33ff66;
      --green-dim: #1f9a3e;
      --green-faint: #0e4a1e;
      /* emphasis + (formerly amber/red) accents, kept green for a uniform phosphor look */
      --amber: #9dffb5;
      --red: #33ff66;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; background: var(--bg); }

    body {
      font-family: 'VT323', monospace;
      color: var(--green);
      font-size: 22px;
      line-height: 1.25;
      overflow: hidden;
      cursor: text;
      -webkit-font-smoothing: none;
    }

    /* ---- CRT frame ---- */
    .crt {
      position: fixed;
      inset: 0;
      padding: 4vh 4vw;
      display: flex;
      overflow: hidden;
    }

    /* curved vignette */
    .crt::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.85) 100%);
    }

    /* scanlines + flicker */
    .crt::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 31;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0)   0px,
        rgba(0,0,0,0)   2px,
        rgba(0,0,0,0.28) 3px,
        rgba(0,0,0,0.28) 4px
      );
      animation: flicker 6s infinite;
    }

    @keyframes flicker {
      0%, 92%, 100% { opacity: 0.55; }
      93% { opacity: 0.45; }
      94% { opacity: 0.62; }
      96% { opacity: 0.5; }
    }

    .terminal {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      text-shadow: 0 0 6px rgba(51, 255, 102, 0.55);
      scrollbar-width: none;
    }
    .terminal::-webkit-scrollbar { display: none; }

    .line { white-space: pre-wrap; word-break: break-word; }
    pre.line { white-space: pre; overflow-x: auto; }

    .dim   { color: var(--green-dim); text-shadow: 0 0 4px rgba(31,154,62,0.5); }
    .amber { color: var(--amber); text-shadow: 0 0 6px rgba(157,255,181,0.5); }
    .red   { color: var(--red); text-shadow: 0 0 6px rgba(51,255,102,0.5); }
    .ok    { color: var(--green); }

    .rule { color: var(--green-faint); letter-spacing: 1px; }

    a.term-link {
      color: var(--amber);
      text-decoration: none;
      border-bottom: 1px dotted currentColor;
    }
    a.term-link:hover { background: var(--amber); color: #000; text-shadow: none; }

    .logo {
      display: block;
      width: 360px;
      max-width: 78%;
      height: auto;
      margin: 0.6rem 0 0.4rem;
      image-rendering: pixelated;
    }

    /* input line */
    .inputline { display: flex; flex-wrap: wrap; align-items: baseline; }
    .prompt { color: var(--green-dim); margin-right: 0.5ch; white-space: nowrap; }
    #cmd { white-space: pre-wrap; word-break: break-word; }

    .cursor {
      display: inline-block;
      width: 0.6ch;
      height: 1.05em;
      background: var(--green);
      box-shadow: 0 0 8px rgba(51,255,102,0.8);
      transform: translateY(0.18em);
      margin-left: 1px;
      animation: blink 1.05s steps(1) infinite;
    }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

    #hiddenInput {
      position: absolute;
      left: -9999px;
      width: 1px; height: 1px;
      opacity: 0;
    }

    @media (max-width: 600px) {
      body { font-size: 18px; }
      .crt { padding: 3vh 5vw; }
      .logo { width: 240px; }
    }
  </style>
</head>
<body>
  <div class="crt">
    <div class="terminal" id="terminal">
      <div id="output"></div>
      <div class="inputline" id="inputline" style="display:none">
        <span class="prompt">guest@idleside:~$</span><span id="cmd"></span><span class="cursor"></span>
      </div>
    </div>
  </div>

  <input id="hiddenInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input">

  <script>
  (function () {
    var IG = "https://www.instagram.com/idleside.studio/";
    var output    = document.getElementById('output');
    var inputline = document.getElementById('inputline');
    var cmdSpan   = document.getElementById('cmd');
    var terminal  = document.getElementById('terminal');
    var hidden    = document.getElementById('hiddenInput');

    function scroll() { terminal.scrollTop = terminal.scrollHeight; }

    function print(text, cls, pre) {
      var el = document.createElement(pre ? 'pre' : 'div');
      el.className = 'line' + (cls ? ' ' + cls : '');
      if (text instanceof Node) el.appendChild(text);
      else if (pre) el.textContent = text;
      else el.innerHTML = (text === '' ? '&nbsp;' : text);
      output.appendChild(el);
      scroll();
      return el;
    }

    // ---------- ASCII goose ----------
    var GOOSE = [
      "                                 ___",
      "                             ,-\"\"   `.",
      "                           ,'  _   e )`-._",
      "                          /  ,' `-._<.===-'",
      "                         /  /",
      "                        /  ;",
      "            _.--.__    /   ;",
      " (`._    _.-\"\"       \\  \\  ;",
      " <_  `-\"\"             \\  \\ ;",
      "   `.                  ;  ;",
      "     ) )               ;  ;",
      "    / /               /  /",
      "   J J               /  /"
    ].join("\n");

    // ---------- command table ----------
    var COMMANDS = {
      help: function () {
        return [
          ['AVAILABLE COMMANDS', 'amber'],
          ['  about         what is idleside', 'dim'],
          ['  instagram     open our feed  (alias: ig)', 'dim'],
          ['  games         current projects', 'dim'],
          ['  play hybrid   boot HYBRID 3.0 in-browser', 'dim'],
          ['  goose         ???', 'dim'],
          ['  whoami        who are you', 'dim'],
          ['  ls            list node contents', 'dim'],
          ['  clear         wipe the screen', 'dim'],
          ['  date          system clock', 'dim'],
          ['  help          this list', 'dim']
        ];
      },
      about: function () {
        return [
          ['IDLESIDE STUDIO', 'amber'],
          'An independent retro-style games studio.',
          'We craft 8-bit adventures out of Chattanooga, TN.',
          '',
          ['Find us:  ' + link('@idleside.studio', IG)]
        ];
      },
      games: function () {
        return [
          ['PROJECT REGISTRY', 'amber'],
          '  [ 01 ]  HYBRID 3.0 ....... playable',
          ['  [ 02 ]  CLASSIFIED ....... in development', 'dim'],
          '',
          ["Run <span class=\"amber\">play hybrid</span> to boot the cartridge."],
          ['Updates posted to ' + link('@idleside.studio', IG)]
        ];
      },
      instagram: function () {
        openIG();
        return [['Opening ' + link('@idleside.studio', IG) + ' ...', 'amber']];
      },
      whoami: function () {
        return [['guest', 'dim'], 'access level: visitor (read-only)'];
      },
      ls: function () {
        return [[
          'about.txt   games/   ' +
          '<span class="dim">honk.wav</span>   ' +
          '<span class="red">restricted/</span>'
        ]];
      },
      date: function () {
        return [[new Date().toString(), 'dim']];
      },
      goose: function () {
        return [[GOOSE, 'amber', true], ['H O N K !', 'amber']];
      },
      sudo: function () {
        return [['Permission denied. This incident has been logged.', 'red']];
      },
      restricted: function () {
        return [['restricted/: access denied — clearance insufficient.', 'red']];
      },
      clear: function () { output.innerHTML = ''; return null; }
    };

    // aliases
    COMMANDS.ig = COMMANDS.instagram;
    COMMANDS.insta = COMMANDS.instagram;
    COMMANDS.honk = COMMANDS.goose;
    COMMANDS.contact = COMMANDS.instagram;
    COMMANDS.dir = COMMANDS.ls;
    COMMANDS.cls = COMMANDS.clear;
    COMMANDS.who = COMMANDS.whoami;

    // play hybrid -> launch the in-browser build
    COMMANDS['play hybrid'] = playHybrid;
    COMMANDS.hybrid = playHybrid;
    COMMANDS.play = function () {
      return [['usage: <span class="amber">play hybrid</span>', 'dim']];
    };

    // secret
    COMMANDS.hulaween = ritual;
    COMMANDS['spirit lake'] = ritual;
    COMMANDS.spiritlake = ritual;

    function link(label, href) {
      return '<a class="term-link" href="' + href + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    }
    function openIG() { window.open(IG, '_blank', 'noopener'); }

    function playHybrid() {
      print('Loading <span class="amber">HYBRID 3.0</span> ...', 'amber');
      print('mounting cartridge // launching emulator', 'dim');
      setTimeout(function () { window.location.href = 'web/'; }, 900);
      return null;
    }

    function ritual() { return [['and so it shall be', 'dim']]; }

    // print a list of result lines; item can be string OR [text, cls, pre]
    function emit(lines) {
      if (!lines) return;
      lines.forEach(function (item) {
        if (Array.isArray(item)) print(item[0], item[1] || '', item[2] || false);
        else print(item);
      });
    }

    function run(raw) {
      var cmd = raw.trim().toLowerCase().replace(/\s+/g, ' ');
      // echo the command
      print('<span class="prompt" style="margin-right:.5ch">guest@idleside:~$</span>' +
            escapeHtml(raw));
      if (cmd === '') return;
      var fn = COMMANDS[cmd] || COMMANDS[cmd.split(' ')[0]];
      if (fn) emit(fn());
      else print("command not found: " + escapeHtml(cmd) + " — type 'help'", 'red');
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---------- live input ----------
    function focusInput() { hidden.focus(); }
    document.addEventListener('click', focusInput);

    hidden.addEventListener('input', function () {
      cmdSpan.textContent = hidden.value;
      scroll();
    });

    hidden.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var v = hidden.value;
        hidden.value = '';
        cmdSpan.textContent = '';
        run(v);
        scroll();
      }
    });

    // ---------- boot sequence ----------
    var BOOT = [
      ['IDLESIDE STUDIO  //  MAINFRAME NODE-07', 'amber'],
      ['========================================', 'rule'],
      ['ESTABLISHING SECURE UPLINK ........ <span class="ok">[OK]</span>', 'dim'],
      ['DECRYPTING SESSION KEY ............ <span class="ok">[OK]</span>', 'dim'],
      ['MOUNTING /idleside ................ <span class="ok">[OK]</span>', 'dim'],
      ['ACCESS LEVEL: <span class="amber">GUEST</span>', 'dim'],
      ['WARNING: UNAUTHORIZED ACCESS IS MONITORED.', 'red'],
      ['========================================', 'rule'],
      ['__LOGO__'],
      ['An independent retro-style games studio.', 'dim'],
      ['crafting 8-bit adventures // Chattanooga, TN', 'dim'],
      [''],
      ['» ' + link('@idleside.studio', IG)],
      [''],
      ["Type <span class=\"amber\">help</span> for available commands."]
    ];

    var i = 0;
    function boot() {
      if (i >= BOOT.length) {
        inputline.style.display = 'flex';
        focusInput();
        scroll();
        return;
      }
      var item = BOOT[i++];
      if (item[0] === '__LOGO__') {
        var img = document.createElement('img');
        img.src = 'assets/idleside-color-logo.png';
        img.alt = 'Idleside Studio';
        img.className = 'logo';
        print(img);
      } else {
        print(item[0], item[1] || '');
      }
      scroll();
      setTimeout(boot, 230 + Math.random() * 160);
    }

    boot();
  })();
  </script>
</body>
</html>
